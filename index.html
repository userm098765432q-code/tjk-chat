<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Суҳбат — Мессенҷер</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-2: #1d2740;
    --text: #e8ecf4;
    --muted: #8a94aa;
    --accent: #4f8cff;
    --accent-2: #6c5cff;
    --border: rgba(255, 255, 255, 0.07);
    --bubble-in: #232d45;
    --radius: 14px;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  [data-theme="light"] {
    --bg: #eef1f7;
    --panel: #ffffff;
    --panel-2: #eef2fa;
    --text: #1c2434;
    --muted: #69738a;
    --border: rgba(0, 0, 0, 0.08);
    --bubble-in: #ffffff;
    --shadow: 0 8px 24px rgba(30, 40, 70, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background 0.25s, color 0.25s;
  }

  .app {
    display: flex;
    height: 100vh;
    max-width: 1200px;
    margin: 0 auto;
    box-shadow: var(--shadow);
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .brand .dot { color: var(--accent); }

  .icon-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
  }
  .icon-btn:hover { background: var(--accent); border-color: transparent; transform: translateY(-1px); }

  .search {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .chat-item {
    display: flex;
    gap: 12px;
    align-items: center;
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: inherit;
    transition: background 0.15s;
  }
  .chat-item:hover { background: var(--panel-2); }
  .chat-item.active { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }

  .avatar {
    width: 46px;
    height: 46px;
    min-width: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    position: relative;
  }

  .avatar .presence {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4ade80;
    border: 2px solid var(--panel);
  }
  .avatar .presence.off { background: #64748b; }

  .chat-item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

  .chat-item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chat-item-name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item-time { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }

  .chat-item-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-item-preview {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .me-name { font-size: 14px; font-weight: 600; }
  .me-status { font-size: 12px; color: #4ade80; }

  /* ---------- Chat ---------- */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-width: 0;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .back-btn { display: none; }

  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-name { font-weight: 700; font-size: 16px; }
  .chat-header-status { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .chat-header-status.online { color: #4ade80; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .day-separator {
    align-self: center;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    margin: 4px 0 10px;
  }

  .msg { display: flex; margin-bottom: 4px; }
  .msg.them { justify-content: flex-start; }
  .msg.me { justify-content: flex-end; }

  .bubble {
    max-width: 68%;
    padding: 9px 13px 6px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.45;
    word-wrap: break-word;
    position: relative;
    animation: pop 0.18s ease-out;
  }
  @keyframes pop {
    from { transform: translateY(6px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .msg.them .bubble { background: var(--bubble-in); border-bottom-left-radius: 4px; }
  .msg.me .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble .meta {
    display: block;
    font-size: 10.5px;
    opacity: 0.65;
    margin-top: 3px;
    text-align: right;
  }

  .typing-dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }

  /* ---------- Composer ---------- */
  .composer-wrap { position: relative; }

  .emoji-panel {
    position: absolute;
    bottom: 62px;
    left: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    box-shadow: var(--shadow);
    z-index: 5;
  }
  .emoji-panel button {
    background: transparent;
    border: none;
    font-size: 20px;
    padding: 6px;
    border-radius: 8px;
    cursor: pointer;
  }
  .emoji-panel button:hover { background: var(--panel-2); }
  .hidden { display: none !important; }

  .composer {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }

  .composer input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .composer input:focus { border-color: var(--accent); }
  .composer input::placeholder { color: var(--muted); }

  .send-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, opacity 0.15s;
  }
  .send-btn:hover:not(:disabled) { transform: scale(1.06); }
  .send-btn:disabled { opacity: 0.35; cursor: default; }

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(128, 140, 170, 0.3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(128, 140, 170, 0.5); }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    .app { box-shadow: none; }
    .sidebar { width: 100%; min-width: 0; }
    .chat { display: none; }
    .app.show-chat .chat { display: flex; }
    .app.show-chat .sidebar { display: none; }
    .back-btn { display: inline-flex; }
    .bubble { max-width: 82%; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand">Суҳбат<span class="dot">.</span></div>
        <button class="icon-btn" id="themeBtn" title="Тағйири мавзӯъ">🌙</button>
      </div>
      <input class="search" id="search" type="text" placeholder="Ҷустуҷӯи гуфтугӯ...">
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <div class="avatar" style="background: linear-gradient(135deg, #22c55e, #0ea5e9);">Ш</div>
      <div>
        <div class="me-name">Шумо</div>
        <div class="me-status">● Дар интернет</div>
      </div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-header">
      <button class="icon-btn back-btn" id="backBtn" title="Бозгашт">←</button>
      <div class="avatar" id="headerAvatar">ФР</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="headerName">—</div>
        <div class="chat-header-status" id="headerStatus">—</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer-wrap">
      <div class="emoji-panel hidden" id="emojiPanel"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="icon-btn" id="emojiBtn" title="Emoji">😀</button>
        <input type="text" id="input" placeholder="Паём нависед...">
        <button type="submit" class="send-btn" id="sendBtn" disabled>➤</button>
      </form>
    </div>
  </main>

</div>

      messages: [

        { from: "me", text: "Ҳамааш бе хато кор мекунад, офарин!", time: "09:06" }
      ]
    },
    {
      id: "nigina", name: "Ниғина Юсупова", initials: "НЮ",
      color: "linear-gradient(135deg, #10b981, #3b82f6)",
      online: false, unread: 0,
      statusText: "Пеш аз 2 соат",
      messages: [
        { from: "me", text: "Ниғина, ташаккур барои кӯмаки дирӯз!", time: "17:20" },
        { from: "them", text: "Дарҳои ҳама вақт кушодааст 😊", time: "17:44" }
      ]
    },
    {
      id: "faridun", name: "Фаридун Саидов", initials: "ФС",
      color: "linear-gradient(135deg, #64748b, #94a3b8)",
      online: true, unread: 0,
      messages: [
        { from: "them", text: "Клуб фардо соати 7, маъмулан 🏃", time: "08:30" },
        { from: "me", text: "Мувофиқ! Он гоҳ то соати 6:45 меоям.", time: "08:35" }
      ]
    },
    {
      id: "zarina", name: "Зарина Шарипова", initials: "ЗШ",
      color: "linear-gradient(135deg, #ec4899, #8b5cf6)",
      online: false, unread: 0,
      statusText: "Дирӯз",
      messages: [
        { from: "me", text: "Расмҳои навро дидам — хеле зебо 🎨", time: "Дирӯз" },
        { from: "them", text: "Ташаккур! Мавзӯи нави навбатӣ тайё мекунам.", time: "Дирӯз" }
      ]
    },
    {
      id: "rustam", name: "Рустам Азизов", initials: "РА",
      color: "linear-gradient(135deg, #14b8a6, #84cc16)",
      online: true, unread: 0,
      messages: [
        { from: "them", text: "Салом! Файли Excel-ро ислоҳ кардам, бинед.", time: "Дирӯз" }
      ]
    }
  ];

  var REPLIES = [
    "Ҳа, албатта! 😊",
    "Хуб аст, мувофиқ шудем.",
    "Айнан, дуруст мегӯӣ 👍",
    "Имрӯз каме машғулам, баъд менависам.",
    "Бисьёр ташаккур! 🙏",
    "Фардо соати 6 шуда бошем?",
    "Аҷоиб! Табрик мекунам 🎉",
    "Нафаҳмидам, як бор дигар бигӯ.",
    "Ман ҳам ҳамин фикрм 😄",
    "Хуб, дубора санҷида ба ту менависам.",
    "Офарин, ки кӯшиш мекунӣ 💪",
    "Биё фардо чой нӯшем ☕",
    "🔥🔥🔥",
    "Мувофиқ бошад, он гоҳ гап мезанем."
  ];

  var EMOJIS = ["😀","😂","😊","😍","🤔","👍","🙏","🎉","❤️","🔥","💪","😢","😎","😅","🤝","✅","📚","☕","⚽","🚀"];

  // ---------- Ҳолат (state) ----------
  var activeId = CONTACTS[0].id;
  var lastReplyIndex = -1;
  var typingEl = null;

  var $ = function (id) { return document.getElementById(id); };

  function activeContact() {
    for (var i = 0; i < CONTACTS.length; i++) {
      if (CONTACTS[i].id === activeId) return CONTACTS[i];
    }
    return CONTACTS[0];
  }

  function nowTime() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
  }

  function lastMessage(c) {
    return c.messages[c.messages.length - 1];
  }

  // ---------- Рӯйхати гуфтугӯҳо ----------
  function renderChatList(filter) {
    var list = $("chatList");
    list.innerHTML = "";
    var f = (filter || "").toLowerCase();

    CONTACTS.forEach(function (c) {
      if (f && c.name.toLowerCase().indexOf(f) === -1) return;
      var lm = lastMessage(c);

      var item = document.createElement("button");
      item.className = "chat-item" + (c.id === activeId ? " active" : "");
      item.type = "button";

      var av = document.createElement("div");
      av.className = "avatar";
      av.style.background = c.color;
      av.textContent = c.initials;
      var pr = document.createElement("span");
      pr.className = "presence" + (c.online ? "" : " off");
      av.appendChild(pr);

      var main = document.createElement("div");
      main.className = "chat-item-main";

      var top = document.createElement("div");
      top.className = "chat-item-top";
      var name = document.createElement("span");
      name.className = "chat-item-name";
      name.textContent = c.name;
      var time = document.createElement("span");
      time.className = "chat-item-time";
      time.textContent = lm ? lm.time : "";
      top.appendChild(name);
      top.appendChild(time);

      var bottom = document.createElement("div");
      bottom.className = "chat-item-bottom";
      var prev = document.createElement("span");
      prev.className = "chat-item-preview";
      prev.textContent = lm ? lm.text : "";
      bottom.appendChild(prev);
      if (c.unread > 0) {
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = c.unread;
        bottom.appendChild(badge);
      }

      main.appendChild(top);
      main.appendChild(bottom);
      item.appendChild(av);
      item.appendChild(main);
      item.addEventListener("click", function () { openChat(c.id); });
      list.appendChild(item);
    });
  }

  $("search").addEventListener("input", function (e) {
    renderChatList(e.target.value);
  });

  // ---------- Гуфтугӯи фаъол ----------
  function renderHeader() {
    var c = activeContact();
    var av = $("headerAvatar");
    av.style.background = c.color;
    av.textContent = c.initials;
    $("headerName").textContent = c.name;
    var st = $("headerStatus");
    if (c.online) {
      st.textContent = "● Дар интернет";
      st.className = "chat-header-status online";
    } else {
      st.textContent = "● " + (c.statusText || "Илғоқ нест");
      st.className = "chat-header-status";
    }
  }

  function buildBubble(msg) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + msg.from;
    var b = document.createElement("div");
    b.className = "bubble";
    b.textContent = msg.text;
    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = msg.time + (msg.from === "me" ? "  ✓✓" : "");
    b.appendChild(meta);
    wrap.appendChild(b);
    return wrap;
  }

  function renderMessages() {
    var box = $("messages");
    box.innerHTML = "";

    var day = document.createElement("div");
    day.className = "day-separator";
    day.textContent = "Имрӯз";
    box.appendChild(day);

    var c = activeContact();
    c.messages.forEach(function (m) {
      box.appendChild(buildBubble(m));
    });
    scrollToBottom();
  }

  function scrollToBottom() {
    var box = $("messages");
    box.scrollTop = box.scrollHeight;
  }

  function openChat(id) {
    activeId = id;
    var c = activeContact();
    c.unread = 0;
    $("emojiPanel").classList.add("hidden");
    renderHeader();
    renderMessages();
    renderChatList($("search").value);
    if (window.innerWidth <= 720) {
      $("app").classList.add("show-chat");
    }
    $("input").focus();
  }

  // ---------- Ирсоли паём ва ҷавоби худкор ----------
  function showTyping(contact) {
    if (contact.id !== activeId) return;
    removeTyping();
    var box = $("messages");
    var wrap = document.createElement("div");
    wrap.className = "msg them";
    var b = document.createElement("div");
    b.className = "bubble";
    var dots = document.createElement("span");
    dots.className = "typing-dots";
    for (var i = 0; i < 3; i++) {
      dots.appendChild(document.createElement("span"));
    }
    b.appendChild(dots);
    wrap.appendChild(b);
    box.appendChild(wrap);
    typingEl = wrap;
    scrollToBottom();
  }

  function removeTyping() {
    if (typingEl && typingEl.parentNode) {
      typingEl.parentNode.removeChild(typingEl);
    }
    typingEl = null;
  }

  function autoReply(contact) {
    var delay = 900 + Math.random() * 1200;
    setTimeout(function () {
      showTyping(contact);
      var replyDelay = 1200 + Math.random() * 1400;
      setTimeout(function () {
        removeTyping();
        var idx = Math.floor(Math.random() * REPLIES.length);
        if (idx === lastReplyIndex) idx = (idx + 1) % REPLIES.length;
        lastReplyIndex = idx;
        contact.messages.push({ from: "them", text: REPLIES[idx], time: nowTime() });
        if (contact.id !== activeId) {
          contact.unread = (contact.unread || 0) + 1;
        } else {
          var box = $("messages");
          box.appendChild(buildBubble({ from: "them", text: REPLIES[idx], time: nowTime() }));
          scrollToBottom();
        }
        renderChatList($("search").value);
      }, replyDelay);
    }, delay);
  }

  $("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = $("input");
    var text = input.value.trim();
    if (!text) return;
    var c = activeContact();
    c.messages.push({ from: "me", text: text, time: nowTime() });
    input.value = "";
    $("sendBtn").disabled = true;

    var box = $("messages");
    box.appendChild(buildBubble({ from: "me", text: text, time: nowTime() }));
    scrollToBottom();
    renderChatList($("search").value);
    autoReply(c);
  });

  $("input").addEventListener("input", function (e) {
    $("sendBtn").disabled = e.target.value.trim().length === 0;
  });

  // ---------- Emoji ----------
  var emojiPanel = $("emojiPanel");
  EMOJIS.forEach(function (em) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = em;
    btn.addEventListener("click", function () {
      var input = $("input");
      input.value += em;
      input.focus();
      $("sendBtn").disabled = false;
      emojiPanel.classList.add("hidden");
    });
    emojiPanel.appendChild(btn);
  });

  $("emojiBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    emojiPanel.classList.toggle("hidden");
  });
  document.addEventListener("click", function (e) {
    if (!emojiPanel.classList.contains("hidden") &&
        !emojiPanel.contains(e.target) &&
        e.target !== $("emojiBtn")) {
      emojiPanel.classList.add("hidden");
    }
  });

  // ---------- Мавзӯъ (тарафи торик/равшан) ----------
  var dark = true;
  $("themeBtn").addEventListener("click", function () {
    dark = !dark;
    document.body.setAttribute("data-theme", dark ? "dark" : "light");
    document.querySelector(".presence").style.borderColor = "";
    $("themeBtn").textContent = dark ? "🌙" : "☀️";
  });

  // ---------- Тугмаи бозгашт (мобилӣ) ----------
  $("backBtn").addEventListener("click", function () {
    $("app").classList.remove("show-chat");
  });

  // ---------- Оғоз ----------
  renderChatList("");
  renderHeader();
  renderMessages();
</script>
</body>
</html>
